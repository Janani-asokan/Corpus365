# Single-server production stack for a small DigitalOcean Droplet.
# Secrets live in /opt/corpus365/.env on the server (never in git).
name: corpus365

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: corpus365
      POSTGRES_USER: corpus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus -d corpus365"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only reachable from the app on the private Docker network.
    shm_size: 128mb
    mem_limit: 256m

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: corpus365-app:latest
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://corpus:${POSTGRES_PASSWORD}@db:5432/corpus365
      DATABASE_SSL: disable # private Docker network, never leaves the server
      DATABASE_POOL_MAX: "5"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    mem_limit: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
